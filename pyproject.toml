[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cosci-lite"
version = "0.1.0"
description = "Personal Co-Scientist-style research topic discovery agent (core loop MVP)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
  "requests>=2.28",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
sim = ["scikit-learn>=1.2"]
dev = ["pytest>=7"]

[project.scripts]
cosci = "cosci.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
